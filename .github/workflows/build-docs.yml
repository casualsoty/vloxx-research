name: Build data & docs

# On every push to main: re-run all analysis scripts on the logs in the repo, rebuild the documentation page,
# and publish it (plus FINDINGS/README/data/scripts) to GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run analysis scripts and build the page
        env:
          DOCS_OUT: _site
          DOCS_BASE: ./
        run: node scripts/build_all.js

      - name: Assemble site
        run: cp -r data scripts FINDINGS.md README.md _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
