name: Build data & docs

# On every push to main: rebuild the documentation page from the committed (already anonymised) data/ and notes,
# and publish it (plus FINDINGS/README/data/scripts) to GitHub Pages. The raw logs are NOT in the repository:
# the analysis (node scripts/build_all.js) runs locally, then data/ is committed.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the page from the committed data
        env:
          DOCS_OUT: _site
          DOCS_BASE: ./
        run: node scripts/build_docs.js

      - name: Assemble site
        run: cp -r data scripts FINDINGS.md README.md _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
